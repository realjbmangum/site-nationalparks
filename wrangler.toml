# BestUSNationalParks.com - Cloudflare Pages Configuration
name = "site-nationalparks-directory"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

[vars]
PUBLIC_MAPBOX_TOKEN = "pk.eyJ1IjoiYm1hbmd1bTEiLCJhIjoiY21qazZzYjk4MXU2bTNkb2IzaDZ5d2cwcSJ9.shiJeOoDR_TydwB3tybPIg"

[env.production]
compatibility_date = "2025-01-01"

[env.production.vars]
SITE_URL = "https://bestusnationalparks.com"
PUBLIC_MAPBOX_TOKEN = "pk.eyJ1IjoiYm1hbmd1bTEiLCJhIjoiY21qazZzYjk4MXU2bTNkb2IzaDZ5d2cwcSJ9.shiJeOoDR_TydwB3tybPIg"

# D1 Database binding - create with:
#   wrangler d1 create parks_db
# Then update the database_id below
[[env.production.d1_databases]]
database_id = "ff199121-eb1b-4c5a-8a6c-8ae514705068"
binding = "DB"
database_name = "national-parks"

# KV namespace for NPS API cache
# Create with: npx wrangler kv:namespace create NPS_CACHE
# Then update the id below
[[env.production.kv_namespaces]]
binding = "NPS_CACHE"
id = "b08db194575a48f4b40ad4690d8d243f"

# Drip Email Sender Worker
# Runs hourly, sends the next drip email to subscribers based on their signup date

name = "parks-drip-sender"
main = "index.ts"
compatibility_date = "2025-01-01"

# Run every hour
[triggers]
crons = ["0 * * * *"]

# Same D1 database as the main site
[[d1_databases]]
binding = "DB"
database_name = "national-parks"
database_id = "ff199121-eb1b-4c5a-8a6c-8ae514705068"

# Secrets (set via wrangler secret put):
# - SENDGRID_API_KEY
